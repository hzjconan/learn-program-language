{{/*
TODO(D19)：敏感配置 → Secret。

要求：
  ① kind: Secret, type: Opaque
  ② 用 stringData 而不是 data —— 不用自己 base64（K8s 存的时候会转）
  ③ DATABASE_URL 用 required 强制：漏传时 helm 直接报
        required "secrets.DATABASE_URL 必须通过 -f 或 --set 传入"
     而不是部署一个连不上库的服务（§6.4）
  ④ API_TOKEN 可选：为空时【整个 key 不出现】（用 with 或 if）
  ⑤ 值一律 quote —— 密码里有 : 或 # 时不 quote 会让 YAML 解析出错

验证：
  helm template t . -f values-dev.yaml | grep -A6 'kind: Secret'
  helm template t . -f values-prod.yaml           # 应该报 required 错误
  helm template t . -f values-prod.yaml --set secrets.DATABASE_URL=x   # 过
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "golearn-api.fullname" . }}
  labels:
    {{- include "golearn-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  {{- /* dev：集群内 Postgres，URL 由 postgres.* 和 Service 名拼出来，只有一份真相 */}}
  {{- with .Values.postgres }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable"
      .user .password (include "golearn-api.fullname" $) .database | quote }}
  {{- end }}
  {{- else }}
  {{- /* prod：外部数据库，必须显式传入 */}}
  DATABASE_URL: {{ required "secrets.DATABASE_URL 必须通过 -f 或 --set 传入" .Values.secrets.DATABASE_URL | quote }}
  {{- end }}
  {{- with .Values.secrets.API_TOKEN }}
  API_TOKEN: {{ . | quote }}
  {{- end }}
