{{/*
非敏感配置。整个 .Values.config 原样变成 data —— 加一个环境变量只要改 values，不用改模板。
⭐ toYaml + nindent 是「把一个 map 塞进 YAML 某一层」的标准写法（§6.4）。
⚠️ 值必须是字符串：RATE_LIMIT: 600 不加引号会渲染成整数，K8s 拒绝 ConfigMap 里的非字符串。
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "golearn-api.fullname" . }}
  labels:
    {{- include "golearn-api.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.config | nindent 2 }}
