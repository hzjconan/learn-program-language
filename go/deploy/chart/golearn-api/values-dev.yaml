# 本机 kind 集群用：
#   helm upgrade --install golearn deploy/chart/golearn-api -f deploy/chart/golearn-api/values-dev.yaml
#
# 只写【和默认值不同】的项 —— 这份文件越短越好，一眼看出 dev 特殊在哪。

config:
  LOG_LEVEL: debug
  LOG_FORMAT: text

postgres:
  enabled: true

secrets:
  # 指向同一个 release 里的 Postgres Service（名字由 _helpers.tpl 生成）。
  # TODO(D19)：把这行改成用 Service 的真实名字。先 helm template 看 postgres.yaml 渲染出来的
  # Service 叫什么，再回来填。⚠️ 这是 dev 专用的明文密码，prod 绝不这么写。
  DATABASE_URL: "postgres://devuser:devpass@CHANGE-ME:5432/golearn?sslmode=disable"
  API_TOKEN: "dev-token"
